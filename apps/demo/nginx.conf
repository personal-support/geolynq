# Site de amostra do GeoLynq: página estática + imagens ilustrativas dos produtos do tenant demo.
# Qualquer outro caminho é 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css image/svg+xml;
    gzip_min_length 512;

    # Cabeçalhos no nível do server: as locations abaixo não definem add_header,
    # então herdam estes (o nginx descarta os herdados se a location definir algum).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # É uma demonstração com dados fictícios: não deve aparecer em buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Healthcheck para o orquestrador (EasyPanel/Docker).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # As imagens são referenciadas pelo banco como https://<dominio>/img/<sku>.svg.
    location /img/ {
        expires 1h;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
