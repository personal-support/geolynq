# Um container, dois sites, separados pelo nome do host (o EasyPanel/Traefik repassa o Host):
#   widget.geolynq.personalsupport.tech  -> bundle do widget (/v1/embed.js)
#   demo.geolynq.personalsupport.tech    -> site de amostra (Fase 4.1)
# Qualquer outro host (ex.: healthcheck por IP) cai no site do widget, que é o padrão.

# ---------- widget: só o bundle. Qualquer outro caminho é 404. ----------
server {
    listen 80 default_server;
    server_name widget.geolynq.personalsupport.tech _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/javascript;
    gzip_min_length 512;

    # Healthcheck para o orquestrador (EasyPanel/Docker).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Contrato público: /v1/embed.js. Mudança incompatível vira /v2/, sem quebrar quem já embutiu v1.
    location /v1/ {
        # Cache curto: correção no widget chega a todos os sites de cliente em até 5 min.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # <script src> não exige CORS, mas não custa liberar (ex.: carregamento via import()/fetch).
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# ---------- demo: site estático de amostra (marca fictícia). Nunca indexar. ----------
server {
    listen 80;
    server_name demo.geolynq.personalsupport.tech;
    root /usr/share/nginx/demo;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css image/svg+xml text/plain;  # text/html é sempre comprimido
    gzip_min_length 512;

    # Estes add_header valem para o site todo; as locations abaixo usam `expires` (e não
    # add_header) de propósito, para não anular a herança destes.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # CSS e ícone: cache curto, para um ajuste visual aparecer logo após o deploy.
    location ~* \.(css|svg)$ {
        expires 5m;
        try_files $uri =404;
    }

    # Raiz: serve o index.html. (Sem `$uri/` no try_files geral, para diretório sem index dar 404, não 403.)
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # HTML (e o resto): sempre revalida.
    location / {
        expires -1;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
