# GeoLynq — landing (site estático). Host: geolynq.personalsupport.tech (a raiz; o DNS curinga *.geolynq não a cobre).
server {
    listen 80 default_server;
    server_name geolynq.personalsupport.tech _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    # Cabeçalhos de segurança do site todo. ATENÇÃO: add_header dentro de uma location APAGA estes; por isso as locations usam só `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Só o que a página usa: nada de script/estilo de terceiros. O formulário fala com o Supabase (connect-src).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://vshlsisnuaugeceafipt.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fontes e imagens: cache longo (os arquivos só mudam com novo nome).
    location ~* \.(woff2|webp|jpg|png)$ {
        expires 30d;
        try_files $uri =404;
    }

    # CSS e JS: sem versão no nome, então revalidam sempre (304 quando não mudou).
    location ~* \.(css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    location = /robots.txt  { default_type text/plain; expires 1h; try_files /robots.txt =404; }
    location = /llms.txt    { default_type text/plain; expires 1h; try_files /llms.txt =404; }
    location = /sitemap.xml { default_type application/xml; expires 1h; try_files /sitemap.xml =404; }

    # Páginas: sempre revalidam. Sem `$uri/`: diretório sem index dá 404, não 403.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location / {
        expires -1;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
